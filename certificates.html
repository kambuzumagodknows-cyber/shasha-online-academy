<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#071747"><title>Certificates | ShaSha Online Academy</title><link rel="icon" href="assets/favicon.svg"><link rel="stylesheet" href="certificates.css"></head><body><header class="top"><a class="brand" href="index.html"><img src="assets/logo-mark.svg" alt=""><span><strong>ShaSha</strong> Certificates</span></a><nav><a href="student.html">Student</a><a href="parent.html">Parent</a><a href="admin.html">Admin</a></nav></header><main><section class="hero"><span>VERIFIABLE ACHIEVEMENTS</span><h1>Proof of progress that can be trusted.</h1><p>Download official ShaSha certificates or verify a certificate using its unique code.</p></section><section class="verify-card"><form id="verify-form"><label>Certificate verification code<input name="code" maxlength="12" placeholder="e.g. 7A91C2D44F10" required></label><button>Verify certificate</button></form><div id="verify-result" class="notice hidden"></div></section><section id="signed-area" class="hidden"><div class="section-head"><div><small>MY VAULT</small><h2 id="vault-title">Certificates</h2></div><button id="refresh">Refresh</button></div><div id="certificate-list" class="grid"></div></section><section id="admin-area" class="hidden"><div class="section-head"><div><small>ADMIN ISSUANCE</small><h2>Issue official certificate</h2></div></div><form id="issue-form" class="issue-form"><label>Learner<select name="learnerId" required></select></label><label>Certificate type<select name="type"><option value="trial_completion">Trial completion</option><option value="course_completion">Course completion</option><option value="academic_excellence">Academic excellence</option><option value="attendance_excellence">Attendance excellence</option><option value="achievement">Special achievement</option></select></label><label>Certificate title<input name="title" required placeholder="Certificate of Academic Excellence"></label><label>Subject or programme<input name="subject"></label><label>Description<textarea name="description" rows="3"></textarea></label><button>Issue certificate</button><div id="issue-message" class="notice hidden"></div></form></section></main><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="https://cdn.jsdelivr.net/npm/jspdf@2.5.1/dist/jspdf.umd.min.js"></script><script src="pdf-engine.js"></script><script src="config.js"></script><script src="supabase-client.js"></script><script src="certificates.js"></script></body></html>
