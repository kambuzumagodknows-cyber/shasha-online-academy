<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#071747"><title>Admissions Hub | ShaSha Admin</title><link rel="icon" href="assets/favicon.svg"><link rel="stylesheet" href="admin.css"><link rel="stylesheet" href="admin-nav.css"><link rel="stylesheet" href="operations.css"></head><body><header class="admin-top"><a class="admin-brand" href="index.html"><img src="assets/logo-mark.svg" alt="">ShaSha Admin</a><div class="admin-actions"><span id="admin-identity"></span><button class="secondary" id="sign-out">Sign out</button></div></header><main class="admin-main"><div class="headline"><div><h1>Admissions Hub</h1><p>One review pipeline for learners, parent-led applications and teachers.</p></div><div><a class="secondary" href="join.html" target="_blank">Open public Join page</a> <button class="secondary" id="refresh">Refresh</button></div></div><div id="message" class="notice hidden"></div><section class="stats"><article class="stat"><small>All applications</small><strong id="all-count">0</strong></article><article class="stat"><small>Students</small><strong id="student-count">0</strong></article><article class="stat"><small>Parents</small><strong id="parent-count">0</strong></article><article class="stat"><small>Teachers</small><strong id="teacher-count">0</strong></article></section><div class="toolbar"><input id="search" placeholder="Search name, email, phone or reference"><select id="type-filter"><option value="">All applicant types</option><option value="parent">Parents</option><option value="student">Students</option><option value="teacher">Teachers</option></select><select id="status-filter"><option value="">All statuses</option><option value="new">New</option><option value="under_review">Under review</option><option value="shortlisted">Shortlisted</option><option value="approved">Approved</option><option value="waitlisted">Waitlisted</option><option value="rejected">Rejected</option></select></div><div id="application-list" class="item-list"></div></main><div class="review-drawer" id="drawer"><button class="drawer-bg" data-close></button><section class="drawer-panel"><div class="drawer-head"><div><h2 id="drawer-title">Application</h2><p id="drawer-reference"></p></div><button class="close" data-close>×</button></div><div id="drawer-details" class="review-grid"></div><form id="review-form"><div class="review-grid"><label>Status<select name="status"><option value="new">New</option><option value="under_review">Under review</option><option value="shortlisted">Shortlisted</option><option value="approved">Approved</option><option value="waitlisted">Waitlisted</option><option value="rejected">Rejected</option></select></label><label class="full">Admin notes<textarea name="notes" rows="5"></textarea></label></div><div class="drawer-actions"><button class="primary">Save review</button><button type="button" class="secondary" data-close>Cancel</button></div></form></section></div><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="config.js"></script><script src="supabase-client.js"></script><script src="admin-nav.js"></script><script src="admissions.js"></script></body></html>
