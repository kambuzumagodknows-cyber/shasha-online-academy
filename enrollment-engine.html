<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#071747"><title>Trial & Payments Centre | ShaSha Admin</title><link rel="icon" href="assets/favicon.svg"><link rel="stylesheet" href="admin.css"><link rel="stylesheet" href="admin-nav.css"><link rel="stylesheet" href="operations.css"><link rel="stylesheet" href="enrollment-engine.css"></head><body><header class="admin-top"><a class="admin-brand" href="index.html"><img src="assets/logo-mark.svg" alt="">ShaSha Admin</a><div class="admin-actions"><span id="admin-identity"></span><button class="secondary" id="sign-out">Sign out</button></div></header><main class="admin-main"><section class="engine-hero"><small>TRIAL-TO-PAID ENGINE</small><h1>Trial & Payments Centre</h1><p>Track each learner’s three trial lessons, verify payments and issue official PDF receipts.</p></section><section class="engine-grid"><article class="engine-card"><small>Trial learners</small><strong id="trial-count">0</strong></article><article class="engine-card"><small>Trial completed</small><strong id="completed-count">0</strong></article><article class="engine-card"><small>Awaiting payment</small><strong id="awaiting-count">0</strong></article><article class="engine-card"><small>Paid learners</small><strong id="paid-count">0</strong></article></section><div class="toolbar"><input id="search" placeholder="Search learner, reference or payment"><select id="filter"><option value="">All enrolments</option><option value="trial">Trial</option><option value="completed">Trial completed</option><option value="submitted">Payment submitted</option><option value="verified">Paid</option></select><button class="secondary" id="refresh">Refresh</button></div><div id="message" class="notice hidden"></div><section id="engine-list" class="engine-list"></section></main><div class="engine-drawer" id="engine-drawer"><button class="engine-drawer-bg" data-close></button><section class="engine-panel"><button class="secondary" data-close>Close</button><h2 id="panel-title">Learner enrolment</h2><div id="panel-summary"></div><section class="engine-form"><h3>Trial lesson tracker</h3><div class="lesson-dots" id="lesson-dots"></div><label>Lesson date<input id="lesson-date" type="date"></label><label>Notes<textarea id="lesson-notes" rows="2"></textarea></label><button class="primary" id="record-lesson">Record next trial lesson</button></section><section class="engine-form"><h3>Verify payment</h3><label>Payment method<select id="payment-method"><option value="ecocash">EcoCash</option><option value="innbucks">Innbucks</option><option value="omari">Omari</option></select></label><label>Transaction reference<input id="payment-reference"></label><label>Amount (USD)<input id="payment-amount" type="number" min="0.01" step="0.01"></label><button class="gold" id="verify-payment">Verify and issue receipt</button></section><section id="receipt-box" class="receipt-box hidden"><h3>Official receipt ready</h3><p id="receipt-summary"></p><button class="gold" id="download-receipt">Download PDF receipt</button></section></section></div><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="https://cdn.jsdelivr.net/npm/jspdf@2.5.1/dist/jspdf.umd.min.js"></script><script src="pdf-engine.js"></script><script src="config.js"></script><script src="supabase-client.js"></script><script src="admin-nav.js"></script><script src="enrollment-engine.js"></script></body></html>
